<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132" role="img" aria-label="Значок Фемиды — Обычная">
  <defs>
    
    <linearGradient id="ring-standard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a4a63"/>
      <stop offset="100%" stop-color="#1b2740"/>
    </linearGradient>
    <radialGradient id="inner-standard" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#28324a"/>
      <stop offset="100%" stop-color="#141d30"/>
    </radialGradient>
    <linearGradient id="metal-standard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7ebf2"/>
      <stop offset="50%" stop-color="#aab4c6"/>
      <stop offset="100%" stop-color="#707d94"/>
    </linearGradient>
    
  </defs>
  
  <circle cx="60" cy="66" r="54" fill="url(#ring-standard)" stroke="#0d1526" stroke-width="3"/>
  <circle cx="60" cy="66" r="46" fill="none" stroke="#0d1526" stroke-width="1.4" opacity="0.55"/>
  <circle cx="60" cy="66" r="46" fill="url(#inner-standard)"/>
  
    <g fill="url(#metal-standard)" stroke="#0b1220" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <!-- finial -->
      <circle cx="60" cy="26" r="5" />
      <!-- vertical pole -->
      <rect x="57" y="30" width="6" height="46" rx="2" />
      <!-- crossbeam -->
      <rect x="26" y="38" width="68" height="5" rx="2.5" />
      <!-- beam pivot -->
      <circle cx="60" cy="40.5" r="4.5" fill="#ffffff" stroke="#0b1220" stroke-width="1.5"/>
      <!-- left chain -->
      <path d="M30 41 L22 62" stroke="#0b1220" stroke-width="2" fill="none"/>
      <path d="M38 41 L30 62" stroke="#0b1220" stroke-width="2" fill="none"/>
      <!-- right chain -->
      <path d="M90 41 L98 62" stroke="#0b1220" stroke-width="2" fill="none"/>
      <path d="M82 41 L90 62" stroke="#0b1220" stroke-width="2" fill="none"/>
      <!-- left pan -->
      <path d="M16 62 Q26 74 36 62" fill="none" stroke="#0b1220" stroke-width="3"/>
      <path d="M16 62 Q26 72 36 62 L34 63 Q26 70 18 63 Z" fill="url(#metal-standard)" stroke="none"/>
      <!-- right pan -->
      <path d="M84 62 Q94 74 104 62" fill="none" stroke="#0b1220" stroke-width="3"/>
      <path d="M84 62 Q94 72 104 62 L102 63 Q94 70 86 63 Z" fill="url(#metal-standard)" stroke="none"/>
      <!-- base plinth -->
      <path d="M42 76 H78 L84 88 H36 Z" />
      <rect x="30" y="88" width="60" height="7" rx="2.5" />
    </g>
    
  
  <text x="60" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#0d1526" letter-spacing="0.5">ОБЫЧНАЯ</text>
</svg>