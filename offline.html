<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <title>Нет подключения — LexPrep</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #14161f;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1117; color: #f4f5f9; }
        p { color: #9aa3b8; }
      }
      .box { max-width: 360px; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 22px; margin: 18px 0 8px; }
      p { margin: 0 0 22px; line-height: 1.5; color: #5b6275; }
      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 26px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #3d5afe;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/assets/favicon/android-chrome-192x192.png" alt="LexPrep" />
      <h1>Нет подключения к интернету</h1>
      <p>LexPrep работает онлайн. Проверьте связь и попробуйте ещё раз.</p>
      <button type="button" onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
