# LexPrep — защита API (api.lexprep.ru) от флуда и перебора паролей.
# Часть 1 из 2: зоны и карты, уровень http {}.
#
# Установка на сервере (nginx на хосте, перед Kong):
#   1. Скопировать этот файл в /etc/nginx/conf.d/lexprep-limits.conf
#      (conf.d подключается внутри http {} в стандартном nginx.conf Ubuntu).
#   2. api-limits-server.conf скопировать в /etc/nginx/snippets/lexprep-api-limits.conf
#      и добавить строку `include snippets/lexprep-api-limits.conf;` внутрь
#      server { ... } для api.lexprep.ru (тот, где listen 443 и proxy_pass на Kong).
#   3. nginx -t && systemctl reload nginx
#
# Что считается: всё по IP клиента. Лимиты подобраны так, чтобы обычная
# работа не упиралась в них даже из общей сети (общежитие, Wi‑Fi вуза —
# там десятки студентов за одним IP), а флуд и перебор — упирались:
#   • весь API — 20 запросов/с с IP, разовый всплеск до +100 (загрузка
#     страницы дёргает много запросов сразу);
#   • вход по паролю, регистрация, восстановление пароля, коды — 20 в
#     минуту с IP, всплеск до +30;
#   • edge-функции (ИИ-консультант, платежи) — 1 в секунду, всплеск до +10;
#     уведомления Т-Кассы о платежах не ограничиваются этой зоной;
#   • не больше 60 одновременных соединений с одного IP.
# Сверх лимита — ответ 429. Тех, кто долбится в лимит постоянно, на час
# банит fail2ban (см. fail2ban-lexprep.local).

# Свои адреса, которые не ограничиваем (например, статический IP админа
# на время массовой загрузки контента). Формат: <адрес/маска> 1;
geo $lexprep_limit_exempt {
    default        0;
    127.0.0.1/32   1;
    ::1/128        1;
}

map $lexprep_limit_exempt $lexprep_client {
    1       "";
    default $binary_remote_addr;
}

# Пустой ключ = запрос в зону не попадает.
map $request_uri $lexprep_auth_key {
    default                                          "";
    ~^/auth/v1/token\?(.*&)?grant_type=password      $lexprep_client;
    ~^/auth/v1/(signup|recover|otp|verify|resend)    $lexprep_client;
}

map $uri $lexprep_fn_key {
    default                                  "";
    ~^/functions/v1/payments-notification    "";
    ~^/functions/v1/                         $lexprep_client;
}

limit_req_zone  $lexprep_client   zone=lexprep_api:20m   rate=20r/s;
limit_req_zone  $lexprep_auth_key zone=lexprep_auth:10m  rate=20r/m;
limit_req_zone  $lexprep_fn_key   zone=lexprep_fn:10m    rate=1r/s;
limit_conn_zone $lexprep_client   zone=lexprep_conn:10m;
