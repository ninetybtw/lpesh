# LexPrep — защита API от флуда. Часть 2 из 2: подключается внутри
# server { ... } для api.lexprep.ru строкой
#     include snippets/lexprep-api-limits.conf;
# Зоны объявлены в api-limits-http.conf (conf.d/lexprep-limits.conf).
#
# Если внутри server есть свои location с собственными limit_req — эти
# строки на них не действуют (nginx не наследует limit_req в location,
# где он задан заново). В обычной схеме «один location / → Kong» всё
# работает как есть.

limit_req  zone=lexprep_api  burst=100 nodelay;
limit_req  zone=lexprep_auth burst=30  nodelay;
limit_req  zone=lexprep_fn   burst=10  nodelay;
limit_conn lexprep_conn 60;

limit_req_status  429;
limit_conn_status 429;

# Медленные атаки (slowloris): соединение, которое тянет заголовки или
# тело запроса дольше этого, закрывается. Ответы ИИ-консультанта это не
# задевает — таймауты считаются между пакетами, а не на весь запрос.
client_header_timeout 10s;
client_body_timeout   30s;
keepalive_timeout     30s;
send_timeout          60s;
