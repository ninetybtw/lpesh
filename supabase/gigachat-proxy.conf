# LexPrep — конфиг Nginx-прокси перед GigaChat API (self-hosted сервер, не
# часть Supabase). edge-runtime не даёт добавить свой доверенный
# сертификат (ни через DENO_CERT, ни через Deno.createHttpClient) для
# ngw.devices.sberbank.ru, который использует российский корневой
# сертификат Минцифры. Nginx берёт TLS до Сбербанка/GigaChat на себя,
# наши edge-функции (ai-consultant, ai-consultant-pro) обращаются к нему
# по простому HTTP внутри докер-сети под именем сервиса gigachat-proxy —
# см. supabase/functions/_shared/gigachat.ts.
#
# Установка на сервере:
#   1. Скачать и собрать российский корневой сертификат в
#      volumes/functions/certs/russian_trusted.pem (root CA + sub CA,
#      https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
#      и https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer).
#   2. Положить этот файл в ~/supabase/docker/gigachat-proxy.conf.
#   3. Добавить в docker-compose.yml сервис gigachat-proxy (image
#      nginx:1.27-alpine), монтирующий этот файл в
#      /etc/nginx/conf.d/default.conf и сертификат в
#      /etc/nginx/certs/russian_trusted.pem.
#   4. docker compose up -d gigachat-proxy

server {
    listen 8080;

    location = /oauth {
        proxy_pass https://ngw.devices.sberbank.ru:9443/api/v2/oauth;
        proxy_ssl_trusted_certificate /etc/nginx/certs/russian_trusted.pem;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_server_name on;
        proxy_set_header Host ngw.devices.sberbank.ru;
    }

    location = /chat {
        proxy_pass https://api.giga.chat/v1/chat/completions;
        proxy_ssl_server_name on;
        proxy_set_header Host api.giga.chat;
    }
}
